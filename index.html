<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Atharva ❤️</title>
  <!-- Google Fonts for typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg: #fff5f5;
      --card: #ffffff;
      --accent: #e53e3e;
      --accent-hover: #c53030;
      --text: #2d3748;
      --muted: #718096;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card);
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--accent);
      font-size: 2.2rem;
      margin-bottom: 20px;
      font-weight: 700;
    }
    .photo-frame {
      margin: 20px 0;
    }
    .photo-frame img {
      max-width: 250px;
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .letter {
      text-align: left;
      line-height: 1.7;
      font-size: 0.98rem;
      color: #4a5568;
      background: #fffaf0;
      border-left: 4px solid #ed8936;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 25px;
    }
    .letter h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.25rem;
      color: #dd6b20;
      margin-top: 18px;
      margin-bottom: 6px;
    }
    
    /* CUSTOM ELEGANT QUOTE BOX */
    .quote-box {
      background: #fff0f3;
      border-left: 5px solid #e53e3e;
      padding: 22px;
      margin: 25px 0;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(229, 62, 62, 0.08);
      position: relative;
    }
    .quote-box::before {
      content: "“";
      font-size: 4.5rem;
      color: #feb2b2;
      position: absolute;
      top: -12px;
      left: 10px;
      font-family: 'Playfair Display', Georgia, serif;
      line-height: 1;
    }
    .quote-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      color: #9b2c2c;
      font-size: 1.15rem;
      margin-bottom: 10px;
      padding-left: 20px;
    }
    .quote-text {
      color: #742a2a;
      font-size: 0.98rem;
      line-height: 1.7;
      margin: 0;
      padding-left: 20px;
      font-style: italic;
    }
    .quote-hindi {
      font-family: 'Playfair Display', Georgia, serif;
      margin-top: 14px;
      padding-left: 20px;
      color: #c53030;
      font-weight: 600;
      font-style: italic;
      font-size: 1.05rem;
    }

    .offerings-heading {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.4rem;
      color: var(--accent);
      margin-top: 25px;
    }

    .offerings {
      margin: 20px 0;
      text-align: left;
    }
    .offering-option {
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .offering-option:hover {
      border-color: var(--accent);
      background: #fff5f5;
    }
